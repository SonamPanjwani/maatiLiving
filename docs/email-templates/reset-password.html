<!-- Supabase → Authentication → Emails → Templates → "Reset password".
     Subject: Reset your Maati Living password
     Paste everything below this comment into "Message body" (Source). The link works for 1 hour. -->
<div style="background:#EDE4D3;padding:32px 16px;font-family:Arial,Helvetica,sans-serif;color:#2A2622">
  <div style="max-width:520px;margin:0 auto;background:#F5EFE4;padding:32px">
    <p style="font-size:11px;letter-spacing:2px;color:#C68A2E;margin:0 0 12px">MAATI LIVING</p>
    <h1 style="font-family:Georgia,'Times New Roman',serif;font-weight:400;font-size:28px;line-height:1.2;margin:0 0 16px">Choose a new password.</h1>
    <p style="font-size:15px;line-height:1.6;margin:0 0 24px">Someone (hopefully you) asked to reset the password for this email. The button works for one hour.</p>
    <p style="margin:0 0 24px"><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/account/reset-password" style="background:#2A2622;color:#EDE4D3;padding:14px 18px;text-decoration:none;font-size:12px;letter-spacing:1.5px;display:inline-block">RESET MY PASSWORD</a></p>
    <p style="font-size:13px;line-height:1.6;color:#665e54;margin:0">If you didn't ask for this, ignore this email — your password stays the same.</p>
  </div>
  <p style="max-width:520px;margin:16px auto 0;font-size:11px;color:#665e54;text-align:center">Maati Living · Thoughtfully chosen. Naturally better.</p>
</div>
