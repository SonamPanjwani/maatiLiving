# Keeps the free Supabase project from pausing (it pauses after 7 days without activity): one tiny read every
# 3 days. Needs repository secrets SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY (docs/DEPLOY.md, "Keep Supabase awake").
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 3 */3 * *"   # every 3 days, 08:47 IST
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read one category
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then echo "Secrets not set"; exit 1; fi
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "apikey: $SUPABASE_PUBLISHABLE_KEY" "$SUPABASE_URL/rest/v1/categories?select=id&limit=1")
          echo "Supabase answered $code"
          test "$code" = "200"
